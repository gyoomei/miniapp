<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FID Checker - Farcaster Mini App</title>
    
    <!-- Essential Open Graph Meta Tags -->
    <meta property="og:title" content="FID Checker - Profile Tool">
    <meta property="og:description" content="View your Farcaster FID, profile photo, and bio instantly. Copy FID with one tap!">
    <meta property="og:image" content="https://miniapp-8oc.pages.dev/assets/social-preview.png">
    <meta property="og:url" content="https://miniapp-8oc.pages.dev/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FID Checker">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FID Checker - Profile Tool">
    <meta name="twitter:description" content="View your Farcaster FID, profile photo, and bio instantly. Copy FID with one tap!">
    <meta name="twitter:image" content="https://miniapp-8oc.pages.dev/assets/social-preview.png">
    <meta name="twitter:url" content="https://miniapp-8oc.pages.dev/">
    
    <!-- Farcaster Frame Meta Tags -->
    <meta property="fc:frame" content="vNext">
    <meta property="fc:frame:image" content="https://miniapp-8oc.pages.dev/assets/social-preview.png">
    <meta property="fc:frame:button:1" content="Open FID Checker">
    <meta property="fc:frame:button:1:action" content="link">
    <meta property="fc:frame:button:1:target" content="https://miniapp-8oc.pages.dev/">
    <meta property="fc:frame:post_url" content="https://miniapp-8oc.pages.dev/api/frame">
    
    <link rel="stylesheet" href="src/styles.css">
    
    <!-- Preload for better performance -->
    <link rel="preconnect" href="https://esm.sh">
    <link rel="dns-prefetch" href="https://esm.sh">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Farcaster ID Checker</h1>
            <p>Your Farcaster profile information</p>
        </div>

        <div class="profile-card">
            <div class="profile-header">
                <img id="profile-picture" src="" alt="Profile Picture" class="profile-pic">
                <div class="profile-info">
                    <h2 id="display-name">Loading...</h2>
                    <div class="fid-section">
                        <span class="fid-label">FID:</span>
                        <span id="fid-value" class="fid-value">---</span>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="copy-fid-btn" class="btn btn-primary">
                    📋 Copy FID
                </button>
                <button id="refresh-btn" class="btn btn-secondary">
                    🔄 Refresh
                </button>
            </div>

            <div class="user-details">
                <div class="detail-item">
                    <span class="detail-label">Username:</span>
                    <span id="username" class="detail-value">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Bio:</span>
                    <span id="bio" class="detail-value">-</span>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">FID copied to clipboard!</div>

    <!-- Load app.js as module -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
