<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Dino Dash</title>
    <meta name="description" content="A tiny endless runner mini app inspired by the offline dino game." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-CU2FfsQn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dkj7ogsw.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="hero-top">
          <span class="pill">Mini Dino Dash</span>
          <span class="pill muted">Tap to jump</span>
        </div>
        <h1>Run, dodge, survive.</h1>
        <p>Game simpel ala offline browser. Ketuk layar atau tombol jump buat hindari obstacle.</p>
        <div class="hud">
          <div class="hud-box">
            <span class="hud-label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud-box">
            <span class="hud-label">Best</span>
            <strong id="best-score">0</strong>
          </div>
          <div class="hud-box">
            <span class="hud-label">Status</span>
            <strong id="status">Ready</strong>
          </div>
        </div>
      </section>

      <section class="game-card">
        <div id="game" class="game-area" aria-label="Mini Dino Dash game area">
          <div class="skyline"></div>
          <div class="ground"></div>
          <div id="player" class="player"></div>
          <div id="obstacle" class="obstacle"></div>
          <div id="message" class="message">Tap Start</div>
        </div>

        <div class="controls">
          <button id="start-btn" class="btn primary">Start</button>
          <button id="jump-btn" class="btn">Jump</button>
          <button id="restart-btn" class="btn">Restart</button>
        </div>
      </section>
    </main>
  </body>
</html>
