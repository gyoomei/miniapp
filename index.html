<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neynar Score Pulse</title>
    <meta name="description" content="Modern Farcaster mini app that shows each visitor's live Neynar score and profile stats." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="app" class="shell" data-tone="growing">
      <section class="hero">
        <div class="badge-row">
          <div class="kicker">Farcaster reputation</div>
          <div class="live-pill"><span class="live-dot"></span> live via Neynar</div>
        </div>

        <div class="profile-row">
          <div class="avatar-wrap">
            <img id="avatar" alt="Profile avatar" src="https://placehold.co/128x128/0f172a/e2e8f0?text=FC" />
            <div class="avatar-glow"></div>
          </div>

          <div class="identity">
            <h1 id="display-name">Loading...</h1>
            <div id="username" class="handle">@loading</div>
            <div id="fid" class="fid-chip">FID --</div>
          </div>
        </div>

        <p id="bio" class="bio">Pulling your Farcaster profile and live Neynar score.</p>

        <div class="score-panel">
          <small>Neynar Score</small>
          <div class="score-value">
            <strong id="score">--</strong>
            <span id="score-label" class="score-tier">Loading</span>
          </div>
          <div id="score-hint" class="score-hint">Calculating trust and social reach...</div>
        </div>
      </section>

      <section class="grid">
        <article class="stat-card">
          <div class="stat-label">Followers</div>
          <div id="followers" class="stat-number">0</div>
          <div class="stat-sub">Audience connected to this profile</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">Following</div>
          <div id="following" class="stat-number">0</div>
          <div class="stat-sub">Accounts this user tracks</div>
        </article>
      </section>

      <section class="actions">
        <button id="refresh-data" class="action-button primary">
          <span>Refresh live score</span>
          <span>↻</span>
        </button>
        <button id="open-profile" class="action-button">
          <span>Open Warpcast profile</span>
          <span class="action-copy">view</span>
        </button>
        <button id="share-miniapp" class="action-button">
          <span>Share this mini app</span>
          <span class="action-copy">cast</span>
        </button>
      </section>

      <div id="status" class="status">Preparing mini app...</div>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
