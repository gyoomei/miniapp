<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neynar Score • MiniApp</title>
  <script src="https://cdn.jsdelivr.net/npm/@farcaster/mini-app@0.2/dist/index.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0a0a1f, #1a0033);
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,245,255,0.25);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .header {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(to right, #00f5ff, #c026d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #00f5ff;
      box-shadow: 0 0 25px rgba(0,245,255,0.6);
    }
    .neynar {
      background: linear-gradient(135deg, #4c1d95, #7e22ce);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }
    .score {
      font-size: 52px;
      font-weight: 800;
      color: white;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: linear-gradient(to right, #22d3ee, #a855f7); color: white; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">NEYNAR SCORE</div>
    
    <div class="profile">
      <img id="avatar" class="avatar" src="" alt="">
      <div>
        <h2 id="username">@username</h2>
        <p id="fid" style="color:#888;">FID: —</p>
      </div>
    </div>

    <div class="neynar">
      <div style="font-size:14px;opacity:0.9;">YOUR SCORE</div>
      <div id="score" class="score">0</div>
      <div id="badge" style="margin-top:8px;font-size:14px;">Power Badge</div>
    </div>

    <button class="btn-primary" onclick="copyFID()">📋 Copy FID</button>
    <button class="btn-secondary" onclick="shareCast()">📢 Share to Cast</button>
    <button class="btn-secondary" onclick="refresh()">🔄 Refresh</button>

    <div id="status" style="text-align:center;margin-top:16px;font-size:14px;color:#666;">Loading...</div>
  </div>

  <script>
    let user = null;

    async function init() {
      try {
        const ctx = await window.farcaster.getContext();
        user = ctx.user;
        document.getElementById('username').textContent = '@' + user.username;
        document.getElementById('fid').textContent = `FID: ${user.fid}`;
        document.getElementById('avatar').src = user.pfp_url;

        // Fetch Neynar Score
        const res = await fetch(`https://api.neynar.com/v2/farcaster/user?fid=${user.fid}`, {
          headers: { 'api_key': 'YOUR_NEYNAR_KEY_HERE' }
        });
        const data = await res.json();
        const score = data.users?.[0]?.score || 0;
        document.getElementById('score').textContent = Math.floor(score);
        document.getElementById('status').innerHTML = '✅ Connected';
      } catch(e) {
        document.getElementById('status').innerHTML = '❌ Error loading data';
      }
    }

    function copyFID() {
      if (user) navigator.clipboard.writeText(user.fid);
      alert('FID copied!');
    }

    function shareCast() {
      if (user) {
        const text = `My Neynar Score is ${document.getElementById('score').textContent} 👀`;
        window.farcaster.openUrl(`https://warpcast.com/~/compose?text=${encodeURIComponent(text)}`);
      }
    }

    function refresh() {
      location.reload();
    }

    window.onload = init;
  </script>
</body>
</html>
