<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neynar Score • MiniApp</title>
  <script src="https://cdn.jsdelivr.net/npm/@farcaster/mini-app@0.2/dist/index.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0a1524, #1a0033);
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,245,255,0.25);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .header {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(to right, #06b6d4, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      box-shadow: 0 0 25px rgba(59,130,246,0.8);
    }
    .neynar {
      background: linear-gradient(135deg, #4c1d95, #9333ea);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }
    .score {
      font-size: 48px;
      font-weight: 800;
      color: white;
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: linear-gradient(to right, #22d3ee, #a855f7); color: white; border: none; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">Your Neynar Profile</div>

    <div id="profile" class="profile">
      <img id="avatar" class="avatar" src="https://via.placeholder.com/72" alt="User Avatar">
      <div>
        <h2 id="username">@username</h2>
        <p id="fid" style="color: #aaaaaa; font-size: 14px;">FID: -</p>
      </div>
    </div>

    <div class="neynar">
      <div style="font-size: 16px; margin-bottom: 8px;">Neynar Score</div>
      <div id="score" class="score">0</div>
      <div id="badge" style="font-size: 14px; margin-top: 4px; color: #d1d5db;">Badge: -</div>
    </div>

    <button class="btn-primary" onclick="refreshData()">🔄 Refresh Data</button>

    <div id="status" style="margin-top: 16px; text-align: center; font-size: 14px; color: #9ca3af;">Loading...</div>
  </div>

  <script>
    async function init() {
      try {
        const { user } = await window.farcaster.getContext();
        const avatar = document.getElementById('avatar');
        const username = document.getElementById('username');
        const fidElement = document.getElementById('fid');
        
        username.textContent = '@' + user.username;
        fidElement.textContent = 'FID: ' + user.fid;
        
        if (user.pfp_url) {
          avatar.src = user.pfp_url;
        }

        const neynarScore = await fetchNeynarScore(user.fid);
        displayNeynarScore(neynarScore);
      } catch (error) {
        document.getElementById('status').textContent = '⚠️ Failed to load user data';
        console.error(error);
      }
    }

    async function fetchNeynarScore(fid) {
      try {
        const response = await fetch(`https://api.neynar.com/v2/farcaster/user?fid=${fid}`, {
          headers: { 'api_key': 'YOUR_NEYNAR_API_KEY' },
        });
        const data = await response.json();
        return data.users?.[0]?.score || 0;
      } catch (error) {
        console.error('Failed to fetch Neynar score:', error);
        return 0;
      }
    }

    function displayNeynarScore(score) {
      document.getElementById('score').textContent = Math.floor(score);
      const badge = document.getElementById('badge');
      badge.textContent = score > 800 ? '🔥 Power User' : 'Standard User';
      document.getElementById('status').textContent = '✅ Data loaded successfully';
    }

    function refreshData() {
      document.getElementById('status').textContent = 'Refreshing...';
      setTimeout(init, 1200);
    }

    window.onload = init;
  </script>
</body>
</html>
