<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farcaster Profile - Mini App</title>
    
    <!-- Preload Critical Resources -->
    <link rel="preload" href="https://esm.sh/@farcaster/miniapp-sdk" as="script">
    <link rel="preconnect" href="https://esm.sh">
    <link rel="dns-prefetch" href="https://esm.sh">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Farcaster Profile - Mini App">
    <meta property="og:description" content="View your Farcaster profile, followers, and following stats instantly">
    <meta property="og:image" content="https://miniapp-8oc.pages.dev/assets/social-preview.png">
    <meta property="og:url" content="https://miniapp-8oc.pages.dev/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Farcaster Profile">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Farcaster Profile - Mini App">
    <meta name="twitter:description" content="View your Farcaster profile, followers, and following stats instantly">
    <meta name="twitter:image" content="https://miniapp-8oc.pages.dev/assets/social-preview.png">
    
    <link rel="stylesheet" href="src/styles.css">
    
    <!-- Inline Critical CSS -->
    <style>
        .critical-loading {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <!-- Critical Loading State -->
    <div id="critical-loading" class="critical-loading">
        <div style="text-align: center; padding: 20px;">
            <div class="skeleton" style="width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px;"></div>
            <div class="skeleton" style="width: 160px; height: 24px; margin: 15px auto;"></div>
            <div class="skeleton" style="width: 120px; height: 18px; margin: 10px auto;"></div>
        </div>
    </div>

    <!-- Main App (Hidden Initially) -->
    <div id="app-content" style="display: none;">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <div class="header-content">
                    <h1>Farcaster Profile</h1>
                    <p>Your farcaster statistics in real time</p>
                </div>
            </div>

            <!-- Profile Card -->
            <div class="profile-card">
                <!-- Profile Header -->
                <div class="profile-header">
                    <div class="avatar-section">
                        <img id="profile-picture" src="" alt="Profile Picture" class="profile-avatar">
                        <div class="online-indicator"></div>
                    </div>
                    <div class="profile-info">
                        <h2 id="display-name">Loading...</h2>
                        <div class="fid-section">
                            <span class="fid-label">FID:</span>
                            <span id="fid-value" class="fid-value">---</span>
                        </div>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">👤</div>
                        <div class="stat-content">
                            <div class="stat-value" id="follower-count">-</div>
                            <div class="stat-label">Followers</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👤</div>
                        <div class="stat-content">
                            <div class="stat-value" id="following-count">-</div>
                            <div class="stat-label">Following</div>
                        </div>
                    </div>
                </div>

                <!-- User Details -->
                <div class="user-details">
                    <div class="detail-item">
                        <span class="detail-label">Username</span>
                        <span id="username" class="detail-value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Account</span>
                        <span class="detail-value badge">Active</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button id="copy-fid-btn" class="btn btn-primary">
                        <span class="btn-icon">📋</span>
                        Copy FID
                    </button>
                    <button id="refresh-btn" class="btn btn-secondary">
                        <span class="btn-icon">🔄</span>
                        Refresh
                    </button>
                </div>
            </div>

            <!-- Info Footer -->
            <div class="info-footer">
                <p>Connected to Farcaster • Real-time data</p>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast">FID copied to clipboard!</div>
    </div>

    <!-- Load App -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
